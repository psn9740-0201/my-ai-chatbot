<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 챗봇</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>🤖 AI 챗봇</h1>
        <button id="reset-btn" class="reset-btn" type="button">새 대화</button>
      </header>

      <main id="chat" class="chat" aria-live="polite">
        <div class="empty" id="empty">
          무엇이든 물어보세요! 이전 대화 내용을 기억하고 답변합니다.
        </div>
      </main>

      <form id="chat-form" class="input-bar">
        <textarea
          id="message-input"
          rows="1"
          placeholder="메시지를 입력하세요 (Shift+Enter: 줄바꿈)"
          autocomplete="off"
          required
        ></textarea>
        <button id="send-btn" type="submit">전송</button>
      </form>
    </div>

    <script src="/script.js"></script>
  </body>
</html>
